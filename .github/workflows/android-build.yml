name: Ayyildiz Tube Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBRETUBE_TAG: v32.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android-SDK installieren
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: LibreTube-Quellcode laden
        run: git clone --depth 1 --branch "$LIBRETUBE_TAG" https://github.com/libre-tube/LibreTube.git upstream

      - name: Branding integrieren
        run: python3 tools/rebrand_libretube.py upstream

      - name: Kompilieren, Tests und statische Pruefung
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug

      - name: APK pruefen und Build-Bericht erstellen
        if: always()
        run: bash tools/build_report.sh upstream | tee BUILD-REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Debug-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Ayyildiz-Tube-debug-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Berichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ayyildiz-Tube-build-bericht
          path: |
            BUILD-REPORT.md
            upstream/app/build/reports/lint-results-debug.html
            upstream/app/build/reports/tests/
          if-no-files-found: warn
