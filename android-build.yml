name: Ayyildiz Tube 2.0 Test-APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and image library
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          python3 -m pip install 'Pillow>=10,<13'
      - name: Fetch exact LibreTube source version
        run: git clone --depth 1 --branch v32.1 https://github.com/libre-tube/LibreTube.git upstream
      - name: Apply branding
        run: python3 tools/rebrand_libretube.py upstream
      - name: Build native Android test APK (not a release!)
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publish test APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayyildiz-Tube-2.0-debug-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
